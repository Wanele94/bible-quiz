<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bible Quiz Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="quiz-container">

        <h1>Bible Quiz</h1>

        <p class="question-number">Question 1 of 10</p>

        <h2 class="question">
            Who built the ark?
        </h2>

        <div class="answer-buttons">
            <button class="answer-btn">Abraham</button>
            <button class="answer-btn">Moses</button>
            <button class="answer-btn">Noah</button>
            <button class="answer-btn">David</button>
        </div>

        <button class="next-btn">Next Question</button>

        <h2 class="question"> Who led the Israelites out of Egpty?</h2>
        <div class="answer-buttons">
            <button class="answer-btn">Joshua</button>
            <button class="answer-btn">Moses</button>
            <button class="answer-btn">Aaron</button>
            <button class="answer-btn">David</button>
        </div>
        <button class="next-btn">Next Question</button>

        <h2 class="question">Who was thrown into the lion's den?</h2>
         <div class="answer-buttons">
            <button class="answer-btn">Elijah</button>
            <button class="answer-btn">Daniel</button>
            <button class="answer-btn">Joel</button>
            <button class="answer-btn">Jeremiah</button>
         </div>
         <button class="next-btn">Next Question</button>

    </div>
 <script src="script.js"></script>
</body>
</html>
